# GPU for the bundled Ollama container (NVIDIA Container Toolkit required).
# install.sh adds this file automatically when you choose "Ollama in Docker with GPU":
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
